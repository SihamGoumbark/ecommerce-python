{% extends 'store/base.html' %}
{% block title %}Mon Profil{% endblock %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h2 class="mb-4 text-center" style="color: rgb(74,109,66);">Mon Profil</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nom d'utilisateur</label>
                        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Adresse Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email }}" placeholder="exemple@email.com" required>
                    </div>
                    <button type="submit" class="btn text-white w-100" style="background-color: rgb(74,109,66);">
                        Enregistrer les modifications
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
